<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pesquisa de opinião</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --navy: #0A1F44;
  --navy-2: #12306B;
  --green: #00A859;
  --green-d: #007A41;
  --yellow: #FFCB05;
  --surface: #FFFFFF;
  --bg: #EEF2F8;
  --text: #0A1F44;
  --muted: #5A6A85;
  --line: #D3DCEB;
  --field: #F6F8FC;
  --err: #C62828;
  color-scheme: light;
}

*, *::before, *::after {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  scroll-padding-top: env(safe-area-inset-top, 0px);
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: "Figtree", system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  display: flex;
  justify-content: center;
}

.app {
  width: 100%;
  max-width: 440px;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}

header {
  background: var(--navy);
  color: #fff;
  padding: 36px 24px 64px;
  position: relative;
  overflow: hidden;
}

header::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 6px;
  background: linear-gradient(
    90deg,
    var(--green) 0 62%,
    var(--yellow) 62% 100%
  );
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

.brand-logo {
  display: block;
  width: 220px;
  max-width: 100%;
  height: auto;
  object-fit: contain;
}

.mark {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  background: var(--navy-2);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 5px;
  padding: 11px 0;
  flex: none;
}

.mark i {
  display: block;
  width: 8px;
  border-radius: 3px 3px 1px 1px;
}

.mark i:nth-child(1) {
  height: 14px;
  background: var(--yellow);
}

.mark i:nth-child(2) {
  height: 26px;
  background: var(--green);
}

.mark i:nth-child(3) {
  height: 20px;
  background: #fff;
}

.brand h1 {
  font-family: "Sora", system-ui, sans-serif;
  font-weight: 800;
  font-size: 24px;
  line-height: 1.1;
  margin: 0;
  letter-spacing: -.01em;
}

.brand h1 span {
  color: var(--yellow);
  font-weight: 500;
  display: block;
  font-size: 14px;
  letter-spacing: 0;
  margin-top: 3px;
}

.lead {
  margin: 26px 0 0;
  font-family: "Sora", system-ui, sans-serif;
  font-weight: 700;
  font-size: 22px;
  line-height: 1.25;
  max-width: 20ch;
}

main {
  flex: 1;
  margin: -36px 16px 0;
  position: relative;
  z-index: 1;
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 24px 20px;
  box-shadow: 0 10px 30px rgba(10, 31, 68, .14);
}

form {
  display: block;
}

.f {
  margin-bottom: 18px;
}

label {
  display: block;
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 7px;
}

input {
  display: block;
  width: 100%;
  min-width: 0;
  height: 50px;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  background: var(--field);
  color: var(--text);
  font: 400 16px "Figtree", system-ui, sans-serif;
  padding: 0 14px;
}

input::placeholder {
  color: var(--muted);
  opacity: .8;
}

input:focus,
button:focus-visible {
  outline: 3px solid var(--yellow);
  outline-offset: 2px;
  border-color: var(--navy);
}

.hint {
  font-size: 13px;
  color: var(--muted);
  margin: 7px 0 0;
}

.err {
  color: var(--err);
  font-size: 13px;
  margin: 5px 0 0;
}

.bad input {
  border-color: var(--err);
}

.cta {
  display: block;
  width: 100%;
  min-height: 52px;
  border: 0;
  border-radius: 14px;
  background: var(--green);
  color: #fff;
  font: 700 17px "Sora", system-ui, sans-serif;
  cursor: pointer;
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .18);
  padding: 12px;
}

.cta:active {
  transform: translateY(1px);
}

.ok {
  display: none;
  text-align: center;
  padding: 18px 4px 6px;
}

.ok.on {
  display: block;
}

.ok .dot {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: var(--green);
  margin: 0 auto 14px;
  display: grid;
  place-items: center;
  color: #fff;
  font-size: 32px;
  font-weight: 700;
  border: 5px solid var(--yellow);
}

.ok h2 {
  font-family: "Sora", system-ui, sans-serif;
  font-size: 21px;
  line-height: 1.3;
  margin: 0 0 8px;
}

.ok p {
  color: var(--muted);
  margin: 0 0 18px;
  overflow-wrap: anywhere;
}

footer {
  padding: 20px 24px calc(24px + env(safe-area-inset-bottom, 0px));
  text-align: center;
  color: var(--muted);
  font-size: 12.5px;
}

/* Tela de carregamento */
#loading-screen {
  position: fixed;
  inset: 0;
  z-index: 99999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 24px;
  background: var(--navy);
  color: #fff;
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transition: opacity .8s ease, visibility 0s linear 0s;
}

#loading-screen.is-hiding {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .8s ease, visibility 0s linear .8s;
}

.loading-brand {
  display: flex;
  align-items: center;
  gap: 13px;
}

.loading-brand h1 {
  font-family: "Sora", system-ui, sans-serif;
  font-weight: 800;
  font-size: 26px;
  line-height: 1.1;
  margin: 0;
}

.loading-brand h1 span {
  display: block;
  color: var(--yellow);
  font-size: 14px;
  font-weight: 500;
  margin-top: 4px;
}

.loading-spinner {
  width: 36px;
  height: 36px;
  border: 3px solid rgba(255, 255, 255, .22);
  border-top-color: var(--green);
  border-right-color: var(--yellow);
  border-radius: 50%;
  animation: loadingSpin .8s linear infinite;
}

.loading-caption {
  font-size: 13px;
  color: #dbe6f8;
  letter-spacing: .04em;
}

@keyframes loadingSpin {
  to {
    transform: rotate(360deg);
  }
}

@media (prefers-reduced-motion: reduce) {
  #loading-screen {
    transition: opacity .8s ease, visibility 0s linear 0s;
  }

  .loading-spinner {
    animation: none;
  }
}

@media (prefers-color-scheme: dark) {
  :root {
    --surface: #0F2650;
    --bg: #071632;
    --text: #F2F6FF;
    --muted: #9FB0D0;
    --line: #264377;
    --field: #0A1D40;
    --err: #FF8A80;
    color-scheme: dark;
  }
}
</style>
</head>
